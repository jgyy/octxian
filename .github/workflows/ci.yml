name: Godot CI
on:
  push:
    branches: [main, feat/jade-vow-godot]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install render and generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: jade-vow-godot-4.7.2-piper-lessac-v1
      - name: Install verified Godot 4.7.2
        run: python tools/bootstrap_godot.py
      - name: Bake 1024 frames and compose score and effects
        run: |
          if [ ! -f assets/generated/sprites/manifest.json ]; then
            python tools/build_assets.py
          fi
      - name: Generate neural narration for all scenes
        run: python tools/generate_voices.py
      - name: Verify animation counts, unique frames and audio provenance
        run: python tools/validate_assets.py
      - name: Import project
        run: |
          mkdir -p build/logs
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee build/logs/import.log
          ! rg 'SCRIPT ERROR:|Parse Error:|ERROR:' build/logs/import.log
      - name: Validate every story route and saves
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/story_test.gd 2>&1 | tee build/logs/story.log
          rg 'JADE_VOW_STORY_TESTS_OK' build/logs/story.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/story.log
      - name: Test UI, every animation cycle and accessibility
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/runtime_test.gd 2>&1 | tee build/logs/runtime.log
          rg 'JADE_VOW_RUNTIME_TESTS_OK' build/logs/runtime.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/runtime.log
      - name: Capture actual rendered game screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 90s xvfb-run -a .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy -- --capture 2>&1 | tee build/logs/capture.log
          rg 'JADE_VOW_CAPTURE_OK' build/logs/capture.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/capture.log
      - name: Package a playable Linux build
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Linux build/jade-vow.pck 2>&1 | tee build/logs/export.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/export.log
          test -s build/jade-vow.pck
          cp .cache/godot/Godot_v4.7.2-stable_linux.x86_64 build/jade-vow
          cp LICENSE assets/generated/voices/MODEL_CARD build/
          tar -czf build/jade-vow-linux.tar.gz -C build jade-vow jade-vow.pck LICENSE MODEL_CARD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-vow-validation
          path: |
            build/logs
            build/screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-linux
          path: build/jade-vow-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
  bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/jade-vow-godot'
    needs: game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jade-vow-godot
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-validation
          path: build
      - name: Bundle verified assets and screenshots on the feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p docs/screenshots
          cp build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/generated docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle 1024 verified frames, neural voices, music and game screenshots"
            git push origin HEAD:feat/jade-vow-godot
          fi

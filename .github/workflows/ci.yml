name: Godot CI
on:
  push:
    branches: [main, feat/jade-vow-godot, feat/expanded-world-quests]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      require_complete:
        description: Require every production deliverable
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install render and generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep ffmpeg
          python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: jade-vow-godot-4.7.2-piper-lessac-v1
      - name: Install verified Godot 4.7.2
        run: python tools/bootstrap_godot.py
      - name: Check intact portrait extraction
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare outfit portraits and compose score and effects
        run: python tools/build_assets.py
      - name: Restore completed narration checkpoints
        id: narration-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/generated/voices/*.wav
            assets/generated/voices/*.ogg
            assets/generated/voices/manifest.json
            assets/generated/voices/MODEL_CARD
          key: jade-vow-lessac-clips-v2-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jade-vow-lessac-clips-v2-${{ github.ref_name }}-${{ github.sha }}-
            jade-vow-lessac-clips-v2-${{ github.ref_name }}-
            jade-vow-lessac-clips-v2-
      - name: Generate neural narration for all scenes
        run: timeout --kill-after=30s 25m python tools/generate_voices.py
      - name: Preserve completed narration after failed generation
        if: ${{ !cancelled() && steps.narration-cache.outcome == 'success' && steps.narration-cache.outputs.cache-primary-key != '' && steps.narration-cache.outputs.cache-hit != 'true' && hashFiles('assets/generated/voices/manifest.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            assets/generated/voices/*.wav
            assets/generated/voices/*.ogg
            assets/generated/voices/manifest.json
            assets/generated/voices/MODEL_CARD
          key: ${{ steps.narration-cache.outputs.cache-primary-key }}
      - name: Verify intact portraits and audio provenance
        run: python tools/validate_assets.py
      - name: Validate world artwork, quest schema and manuscript accounting
        env:
          REQUIRE_COMPLETE: ${{ inputs.require_complete || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        run: |
          if [ "$REQUIRE_COMPLETE" = true ]; then
            python tools/validate_world.py --require-complete
          else
            python tools/validate_world.py
          fi
      - name: Render body bob previews and contact sheets
        run: python tools/preview_animations.py
      - name: Import project
        run: |
          mkdir -p build/logs
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee build/logs/import.log
          ! rg 'SCRIPT ERROR:|Parse Error:|ERROR:' build/logs/import.log
      - name: Validate every story route and saves
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/story_test.gd 2>&1 | tee build/logs/story.log
          rg 'JADE_VOW_STORY_TESTS_OK' build/logs/story.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/story.log
      - name: Test UI, body bobbing and accessibility
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --verbose --headless --path . --script tests/runtime_test.gd 2>&1 | tee build/logs/runtime.log
          rg 'JADE_VOW_RUNTIME_TESTS_OK' build/logs/runtime.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/runtime.log
      - name: Capture actual rendered game screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 90s xvfb-run -a .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy -- --capture 2>&1 | tee build/logs/capture.log
          rg 'JADE_VOW_CAPTURE_OK' build/logs/capture.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/capture.log
          python tools/verify_screenshots.py
      - name: Package a playable Linux build
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Linux build/jade-vow.pck 2>&1 | tee build/logs/export.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/export.log
          test -s build/jade-vow.pck
          cp .cache/godot/Godot_v4.7.2-stable_linux.x86_64 build/jade-vow
          cp LICENSE assets/generated/voices/MODEL_CARD docs/GODOT_LICENSE.txt docs/GODOT_COPYRIGHT.txt build/
          tar -czf build/jade-vow-linux.tar.gz -C build jade-vow jade-vow.pck LICENSE MODEL_CARD GODOT_LICENSE.txt GODOT_COPYRIGHT.txt
      - name: Test packaged game without the source checkout
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 30s xvfb-run -a ./jade-vow --verbose --audio-driver Dummy -- --smoke-build 2>&1 | tee logs/package.log
          rg 'JADE_VOW_PACKAGE_OK' logs/package.log
          ! rg 'SCRIPT ERROR:|ERROR:' logs/package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-vow-validation
          path: |
            build/content_report.json
            build/logs
            build/screenshots
            build/animations
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-linux
          path: build/jade-vow-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
  bundle:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/jade-vow-godot' || github.ref == 'refs/heads/feat/expanded-world-quests')
    needs: game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-validation
          path: build
      - name: Bundle verified assets and screenshots on the feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUNDLE_BRANCH: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git add -f assets/generated
          REVIEW_INPUTS_SHA=$(git ls-tree -r "$EXPECTED_SHA" -- data scripts scenes tools project.godot assets/art .github/workflows/ci.yml | sha256sum | cut -d" " -f1)
          review_unchanged=false
          if [ -s docs/review_inputs.sha256 ] && [ "$(cat docs/review_inputs.sha256)" = "$REVIEW_INPUTS_SHA" ]; then
            review_unchanged=true
          fi
          missing_capture=false
          for capture in title dialogue cast wardrobe_training wardrobe_festival outfit_dialogue quest_hub spirit_encounter world_gallery ferry_encounter archive_encounter river_pilot river_spirit river_harbor object_bronze_clapper object_sealed_echo_case interior_gallery attributes attribute_choices orchard_healer orchard_spirit orchard_choices city_market city_mask_maker city_archivist city_courier city_perfumer city_courser city_moth city_choices court_upper_bench court_luo_shan court_bai_qun court_du_heng court_rain_heron court_investigation_choice court_final_choice court_weather_setup; do
            if [ ! -s "docs/screenshots/$capture.jpg" ]; then
              missing_capture=true
            fi
          done
          if [ ! -s docs/animations/motions.webp ]; then
            missing_capture=true
          fi
          if git diff --cached --quiet && [ "$missing_capture" = false ] && [ "$review_unchanged" = true ]; then
            echo "Verified assets and wardrobe screenshots are already bundled."
            exit 0
          fi
          mkdir -p docs/screenshots docs/animations
          cp build/animations/*.webp build/animations/*.jpg docs/animations/
          cp build/content_report.json docs/content_report.json
          printf '%s\n' "$REVIEW_INPUTS_SHA" > docs/review_inputs.sha256
          cp build/screenshots/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/generated docs/screenshots docs/animations docs/content_report.json docs/review_inputs.sha256
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle portraits, bob previews and game screenshots"
            git push origin "HEAD:$BUNDLE_BRANCH"
          fi

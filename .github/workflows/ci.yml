name: Godot CI
on:
  push:
    branches: [main, feat/jade-vow-godot, feat/expanded-world-quests, codex/cultivation-rewrite-20261003, codex/million-word-continuity-20261003, codex/million-word-ensemble-20261004, codex/narrative-difficulty-20261005, codex/storm-salt-continuity-20261006, codex/careers-20261007]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      require_complete:
        description: Require every production deliverable
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
  actions: read
concurrency:
  group: godot-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-verify' || '' }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install render and generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri ripgrep ffmpeg
          python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: jade-vow-godot-4.7.2-piper-lessac-v1
      - name: Install verified Godot 4.7.2
        run: python tools/bootstrap_godot.py
      - name: Check native portraits and continuity regressions
        run: |
          git fetch --depth=1 origin cc4bb2d558bcdb7deae656a76ae07abde30f7a6b
          python -m tools.validate_million_continuation --verify-source
          git fetch --depth=1 origin 2b431cb2c113608bb05e1c95edc1ef9b7879d01f
          python -m tools.validate_narrative_revision --verify-source
          git fetch --depth=1 origin 633047ddadf5ef18bd2a15dca9deebdec2ceff32
          python -m tools.validate_additional_repairs --verify-source
          git fetch --depth=1 origin c90102c720c0fd97fe31559851c57ee38e976d55
          python -m tools.validate_storm_salt_repairs --verify-source
          git fetch --depth=1 origin 3530d7283d0f326771b8f3661c173ad222591898
          python -m tools.validate_consequence_revision --verify-source
          git fetch --depth=1 origin 1bb309ba5cc8621673a041e80b91cf38414af8cb
          python -m tools.validate_semantic_sweep --verify-source
          git fetch --depth=1 origin a8d6ddf1d7c73c77fc8c66be6932fab403269bfc
          git fetch --depth=1 origin 659f6c413867a3c7d5857e4b89c4f3aae1f39ae8
          python -m tools.validate_reed_crossing --verify-source
          python -m tools.validate_career_repairs --verify-source
          python -m tools.validate_harbor_identity_repairs --verify-source
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/validate_continuation_audits.py --source-base d2ce2851c8e47842104607ec5999ffba6fdabe1c --source-node-index docs/CONTINUATION_SOURCE_INDEX_20261003.json
          python tools/validate_continuation_audits.py docs/CONTINUITY_REPAIRS_20261003_SECOND_RIVER.json docs/CONTINUITY_REPAIRS_20261003_SECOND_CITY.json docs/CONTINUITY_REPAIRS_20261003_SECOND_CULTIVATION.json docs/CONTINUITY_REPAIRS_20261003_SECOND_RING.json docs/CONTINUITY_REPAIRS_20261003_SECOND_FERRY.json docs/CONTINUITY_REPAIRS_20261003_SECOND_ORCHARD.json --source-base c45164a3fc00c2a139158730b2f98f2db9926003 --source-node-index docs/CONTINUATION_SECOND_SOURCE_INDEX_20261003.json
      - name: Prepare outfit portraits and compose score and effects
        run: python tools/build_assets.py
      - name: Validate world artwork, quest schema and manuscript accounting
        env:
          REQUIRE_COMPLETE: ${{ inputs.require_complete || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        run: |
          if [ "$REQUIRE_COMPLETE" = true ]; then
            python tools/validate_world.py --require-complete
          else
            python tools/validate_world.py
          fi
      - name: Render body bob previews and contact sheets
        run: python tools/preview_animations.py
      - name: Import project
        run: |
          mkdir -p build/logs
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee build/logs/import.log | tail -n 40
          ! rg 'SCRIPT ERROR:|Parse Error:|ERROR:' build/logs/import.log
      - name: Validate every story route and saves
        run: |
          timeout 240s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/story_test.gd 2>&1 | tee build/logs/story.log
          rg 'JADE_VOW_STORY_TESTS_OK' build/logs/story.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/story.log
      - name: Test UI, body bobbing and accessibility
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --verbose --headless --path . --script tests/runtime_test.gd 2>&1 | tee build/logs/runtime.log
          rg 'JADE_VOW_RUNTIME_TESTS_OK' build/logs/runtime.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/runtime.log
      - name: Test completed practice, late roles, ensembles and layered effects
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/continuation_test.gd 2>&1 | tee build/logs/continuation.log
          rg 'JADE_VOW_CONTINUATION_TESTS_OK' build/logs/continuation.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/continuation.log
      - name: Test deferred growth, old checkpoints and desert dilemmas
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/narrative_revision_test.gd 2>&1 | tee build/logs/narrative-revision.log
          rg 'JADE_VOW_NARRATIVE_REVISION_TESTS_OK' build/logs/narrative-revision.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/narrative-revision.log
      - name: Test both causality revisions and legacy credit thresholds
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/additional_repairs_test.gd 2>&1 | tee build/logs/additional-repairs.log
          rg 'JADE_VOW_ADDITIONAL_REPAIRS_TESTS_OK' build/logs/additional-repairs.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/additional-repairs.log
      - name: Test storm and salt-road completion credit and all save revisions
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/storm_salt_repairs_test.gd 2>&1 | tee build/logs/storm-salt-repairs.log
          rg 'JADE_VOW_STORM_SALT_REPAIRS_TESTS_OK' build/logs/storm-salt-repairs.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/storm-salt-repairs.log
      - name: Test persistent choices and delayed narrative consequences
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/consequences_test.gd 2>&1 | tee build/logs/consequences.log
          rg 'JADE_VOW_CONSEQUENCES_TESTS_OK' build/logs/consequences.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/consequences.log
      - name: Test saved commitments against every authored delayed route
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/authored_consequences_test.gd 2>&1 | tee build/logs/authored-consequences.log
          rg 'JADE_VOW_AUTHORED_CONSEQUENCES_TESTS_OK' build/logs/authored-consequences.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/authored-consequences.log
      - name: Test Reed Crossing branch combinations and completed work
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/reed_crossing_test.gd 2>&1 | tee build/logs/reed-crossing.log
          rg 'JADE_VOW_REED_CROSSING_TESTS_OK' build/logs/reed-crossing.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/reed-crossing.log
      - name: Test career enrollment, completed training and saved portfolios
        run: |
          timeout 90s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/careers_test.gd 2>&1 | tee build/logs/careers.log
          rg 'JADE_VOW_CAREERS_TESTS_OK' build/logs/careers.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/careers.log
      - name: Test commissioned work, retained specialties and saved reviews
        run: |
          timeout 240s .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/commissions_test.gd 2>&1 | tee build/logs/commissions.log
          rg 'JADE_VOW_COMMISSIONS_TESTS_OK' build/logs/commissions.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/commissions.log
      - name: Capture actual rendered game screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 240s xvfb-run -a .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --audio-driver Dummy -- --capture 2>&1 | tee build/logs/capture.log
          rg 'JADE_VOW_CAPTURE_OK' build/logs/capture.log
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/capture.log
          python tools/verify_screenshots.py
      - name: Restore completed narration checkpoints
        id: narration-cache
        # A checkpoint cache must not overwrite the integrated, committed baseline.
        # The generator independently validates every retained clip against the text.
        if: hashFiles('assets/generated/voices/archive_25_001.ogg') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/generated/voices/*.wav
            assets/generated/voices/*.ogg
            assets/generated/voices/manifest.json
            assets/generated/voices/MODEL_CARD
          key: jade-vow-lessac-clips-v2-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jade-vow-lessac-clips-v2-${{ github.ref_name }}-${{ github.sha }}-
            jade-vow-lessac-clips-v2-${{ github.ref_name }}-
            jade-vow-lessac-clips-v2-
      - name: Restore separately verified draft narration
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice-prebuild
          key: jade-vow-prebuild-v1-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            jade-vow-prebuild-v1-${{ github.head_ref || github.ref_name }}-
            jade-vow-prebuild-v1-codex/million-word-continuity-20261003-
      - name: Restore narration from the verified integration build
        if: hashFiles('assets/generated/voices/archive_25_001.ogg') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jade-vow-generated-assets
          run-id: 37182354432
          github-token: ${{ github.token }}
          path: .cache/voice-prebuild/assets/generated
      - name: Restore narration from the verified career build
        if: hashFiles('assets/generated/voices/career_entry.ogg') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jade-vow-generated-assets
          run-id: 37627278608
          github-token: ${{ github.token }}
          path: .cache/voice-prebuild/assets/generated
      - name: Generate neural narration for all scenes
        env:
          JADE_VOW_VOICE_WORKERS: '4'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: timeout --kill-after=30s 240m python tools/generate_voices.py
      - name: Preserve completed narration after failed generation
        if: ${{ always() && steps.narration-cache.outcome == 'success' && steps.narration-cache.outputs.cache-primary-key != '' && steps.narration-cache.outputs.cache-hit != 'true' && hashFiles('assets/generated/voices/manifest.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: |
            assets/generated/voices/*.wav
            assets/generated/voices/*.ogg
            assets/generated/voices/manifest.json
            assets/generated/voices/MODEL_CARD
          key: ${{ steps.narration-cache.outputs.cache-primary-key }}
      - name: Import completed narration
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee build/logs/narration-import.log | tail -n 40
          ! rg 'SCRIPT ERROR:|Parse Error:|ERROR:' build/logs/narration-import.log
      - name: Verify intact portraits and audio provenance
        run: python tools/validate_assets.py
      - name: Package a playable Linux build
        run: |
          .cache/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-pack Linux build/jade-vow.pck 2>&1 | tee build/logs/export.log | tail -n 40
          ! rg 'SCRIPT ERROR:|ERROR:' build/logs/export.log
          test -s build/jade-vow.pck
          cp .cache/godot/Godot_v4.7.2-stable_linux.x86_64 build/jade-vow
          cp LICENSE assets/generated/voices/MODEL_CARD docs/GODOT_LICENSE.txt docs/GODOT_COPYRIGHT.txt build/
          tar -czf build/jade-vow-linux.tar.gz -C build jade-vow jade-vow.pck LICENSE MODEL_CARD GODOT_LICENSE.txt GODOT_COPYRIGHT.txt
      - name: Test packaged game without the source checkout
        working-directory: build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 30s xvfb-run -a ./jade-vow --verbose --audio-driver Dummy -- --smoke-build 2>&1 | tee logs/package.log
          rg 'JADE_VOW_PACKAGE_OK' logs/package.log
          ! rg 'SCRIPT ERROR:|ERROR:' logs/package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jade-vow-validation
          path: |
            build/content_report.json
            build/logs
            build/screenshots
            build/animations
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-linux
          path: build/jade-vow-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
  bundle:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/jade-vow-godot' || github.ref == 'refs/heads/feat/expanded-world-quests' || github.ref == 'refs/heads/codex/cultivation-rewrite-20261003' || github.ref == 'refs/heads/codex/million-word-continuity-20261003' || github.ref == 'refs/heads/codex/million-word-ensemble-20261004' || github.ref == 'refs/heads/codex/narrative-difficulty-20261005' || github.ref == 'refs/heads/codex/storm-salt-continuity-20261006' || github.ref == 'refs/heads/codex/careers-20261007')
    needs: game
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-generated-assets
          path: assets/generated
      - uses: actions/download-artifact@v4
        with:
          name: jade-vow-validation
          path: build
      - name: Bundle verified assets and screenshots on the feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUNDLE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git add -f assets/generated
          REVIEW_INPUTS_SHA=$(git ls-tree -r "$EXPECTED_SHA" -- data scripts scenes tools project.godot assets/art .github/workflows/ci.yml | sha256sum | cut -d" " -f1)
          review_unchanged=false
          if [ -s docs/review_inputs.sha256 ] && [ "$(cat docs/review_inputs.sha256)" = "$REVIEW_INPUTS_SHA" ]; then
            review_unchanged=true
          fi
          missing_capture=false
          for capture in title dialogue cast wardrobe_training wardrobe_festival outfit_dialogue quest_hub spirit_encounter world_gallery ferry_encounter archive_encounter river_pilot river_spirit river_harbor object_bronze_clapper object_sealed_echo_case interior_gallery attributes attribute_choices orchard_healer orchard_spirit orchard_choices city_market city_mask_maker city_archivist city_courier city_perfumer city_courser city_moth city_choices court_upper_bench court_luo_shan court_bai_qun court_du_heng court_rain_heron court_investigation_choice court_final_choice court_weather_setup ridge_surveyor ridge_tortoise ridge_weather ridge_cloudhound ridge_discharge ridge_choices object_storm_compass storm_observatory storm_choices salt_watermill salt_forewoman salt_salamander salt_choices forest_ensemble lanternwing_crane desert_attributes archive_ensemble archive_courtyard archive_lantern_keeper bitter_wells_yard bitter_wells_workroom bitter_wells_lodging desert_dilemma completed_comparison storm_completed_practice salt_completed_practice consequence_choices consequence_house consequence_school consequence_lamp native_lark_pass_cliff_market native_outer_shoal_salvage_yard native_vermilion_hollows_inspection_gallery native_kestrel_basin_heat_court native_mirror_basin_reservoir_cloister native_chime_reach_relay_plaza native_qin_bo native_reservoir_qiu_nan native_reservoir_mei_rong native_reservoir_jing_su native_reservoir_fu_lian native_reservoir_zhou_wen native_reservoir_tian_yu native_mine_worker_lodging native_mine_surface_yard native_mine_clinic_room native_mine_practice_court native_wintercity_gao_shen native_mine_wei_yan native_lantern_shao_ye native_lark_pass_avalanche_shelter reed_crossing_choice reed_crossing_grain reed_crossing_linen reed_crossing_wages career_enrolment career_kiln career_archive career_survey career_independent career_portfolio career_portfolio_archive career_portfolio_survey career_portfolio_independent commission_offer commission_kiln commission_archive commission_survey commission_independent commission_portfolio_kiln commission_portfolio_archive commission_portfolio_survey commission_portfolio_independent commission_kiln_kitchen; do
            if [ ! -s "docs/screenshots/$capture.jpg" ]; then
              missing_capture=true
            fi
          done
          if [ ! -s docs/animations/motions.webp ]; then
            missing_capture=true
          fi
          if git diff --cached --quiet && [ "$missing_capture" = false ] && [ "$review_unchanged" = true ]; then
            echo "Verified assets and wardrobe screenshots are already bundled."
            exit 0
          fi
          mkdir -p docs/screenshots docs/animations
          cp build/animations/*.webp build/animations/*.jpg docs/animations/
          cp build/content_report.json docs/content_report.json
          printf '%s\n' "$REVIEW_INPUTS_SHA" > docs/review_inputs.sha256
          cp build/screenshots/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/generated docs/screenshots docs/animations docs/content_report.json docs/review_inputs.sha256
          if ! git diff --cached --quiet; then
            git commit -m "assets: bundle portraits, bob previews and game screenshots"
            git push origin "HEAD:$BUNDLE_BRANCH"
            BUNDLE_REQUIRE_COMPLETE=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BUNDLE_BRANCH&state=open" --jq 'any(.[]; .draft == false)')
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f "ref=$BUNDLE_BRANCH" -F "inputs[require_complete]=$BUNDLE_REQUIRE_COMPLETE"
          fi
